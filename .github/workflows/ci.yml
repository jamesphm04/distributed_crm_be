name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the code
        uses: actions/checkout@v7

      - name: Install .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Build the solution
        run: dotnet build --configuration Release

      - name: Build the API image
        run: docker build --tag distributed-crm-be:ci .

      - name: Build the migrate image
        run: docker build --target migrate --tag distributed-crm-migrate:ci .
